name: Quality

on:
  pull_request:
  push:
    branches:
      - master
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify platform
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: intl, mbstring, pdo_pgsql, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install PHP dependencies
        run:
          composer install --working-dir=apps/backend --no-interaction --prefer-dist --no-progress

      - name: Run repository verification
        run: npm run verify
